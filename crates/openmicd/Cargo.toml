[package]
name = "openmicd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openmicd"
path = "src/main.rs"

[dependencies]
openmic-proto = { path = "../openmic-proto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
