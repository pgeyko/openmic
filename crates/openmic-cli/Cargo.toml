[package]
name = "openmic-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openmic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
openmic-proto = { path = "../openmic-proto" }
